name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: glh
          POSTGRES_PASSWORD: glh
          POSTGRES_DB: greenlighthouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U glh -d greenlighthouse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # Backs the incremental cache (Story 1.8). The caching suite asserts entries
      # actually land in Redis, so this is required, not optional.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # BullMQ's instance (Story 3.0). Separate from the cache above because
      # FLUSHALL, maxmemory and persistence are all instance-wide — see
      # .env.example. Provisioned now, ahead of Story 3.3's worker, so that
      # story's tests have a real queue to run against rather than an
      # environment-gated skip.
      redis-queue:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # Attachment scanning (Story 3.7b). Unlike MinIO this CAN be a service
      # container: the clamav image needs no command override, so `services:`
      # works and no manual `docker run` step is required.
      #
      # Digest-pinned to the same image docker-compose uses, so CI and dev scan
      # against the identical signature set. Signatures are BAKED INTO this tag
      # (verified on the running container) — do NOT switch to `_base`, which
      # ships without them and pays a multi-minute freshclam download on boot.
      #
      # The e2e probe that consumes this must FAIL in CI rather than skip: Story
      # 2.3 proved an env-gated test can skip silently for a pipeline's entire
      # life, and a skipped malware-detection test in a merge gate is
      # indistinguishable from a passing one.
      clamav:
        image: clamav/clamav@sha256:24cab211a882e9f767b84b76afe197d82554306ad6d43b782f80cd6aa1e61427
        ports:
          - 3310:3310
        options: >-
          --health-cmd "clamdcheck.sh"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 120s

    env:
      # Set EXPLICITLY (Story 3.0 code review). GitHub Actions defines CI=true by
      # default, but `repository.integration.test.ts`'s beforeAll uses it to decide
      # whether to RETHROW or skip ~30 assertions — the difference between a merge
      # gate that catches a missing column and one that reports green skips. A
      # load-bearing gate must not rest on a provider's implicit default.
      CI: "true"
      DATABASE_URL: postgresql://glh:glh@localhost:5432/greenlighthouse?schema=public
      REDIS_URL: redis://localhost:6379
      REDIS_QUEUE_URL: redis://localhost:6380
      REVALIDATE_SECRET: ci-revalidate-secret
      # Object storage for the Story 2.3 download endpoint. MinIO runs as a STEP
      # rather than a service container because `minio/minio` needs a command
      # (`server /data`) and `services:` cannot override one.
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: greenlighthouse-media
      # ClamAV for the Story 3.7b attachment scan. Set here rather than left to
      # the client's `localhost` default so the value is visible next to the
      # service that provides it.
      CLAMAV_HOST: localhost
      CLAMAV_PORT: "3310"
      # Story 3.3's mail settings. DEFENSIVE DEFAULTS, NOT A TEST DEPENDENCY —
      # and the comment that used to sit here claimed otherwise, which the 3.3
      # review caught. No test reads these from the ambient environment: the
      # send-flow proof injects its own MemoryTransport and writes its own
      # RFQ_NOTIFY_TO. They are set so that any FUTURE path reaching
      # `createEmailTransport()` or `resolveNotifyRecipient()` in CI resolves
      # deterministically and can never select the real provider.
      EMAIL_PROVIDER: memory
      RFQ_NOTIFY_TO: ci-notify@glh.invalid
      EMAIL_FROM: ci-rfq@glh.invalid

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      # The e2e suites assert against seeded content, so the seed is part of the
      # gate rather than a local convenience.
      - run: npx prisma db seed

      # STORAGE FIXTURES (added in the Story 2.3 review). Without these, CI had
      # no MinIO at all: the download e2e's storage probe found nothing and the
      # AC1 test — the only end-to-end proof that documents download — skipped on
      # every run, permanently and silently. A skipped keystone test in the merge
      # gate is indistinguishable from a passing one.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
      - name: Wait for MinIO
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:9000/minio/health/live >/dev/null 2>&1; then
              echo "MinIO ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "MinIO did not become ready"; docker logs minio; exit 1
      - run: npx tsx scripts/seed-storage.ts
      - run: npm run lint
      - run: npm run typecheck
      # Listed as a gate by Story 1.8 AC8 but previously missing here, so drift
      # could land on main while the story claimed it was enforced.
      - run: npm run format:check
      # AC7 GUARD (Story 1.9): the build must NEVER require a database — a hard
      # constraint from Story 1.3, re-verified in 1.8, and previously enforced only
      # by someone remembering to test it by hand. Building against a dead port
      # makes any reintroduction of build-time DB access fail here instead of in
      # production. Costs nothing: this replaces the ordinary build rather than
      # adding a second one.
      #
      # REDIS_URL IS BLANKED HERE DELIBERATELY (Story 2.1). Measured: with a WARM
      # Redis this guard silently passes even when a route reads the database at
      # build time — a `generateStaticParams` calling `listIndustries()` built
      # cleanly against a dead Postgres because `cached()` served it from Redis,
      # and produced 28 prerendered pages while reporting success. Flushing Redis
      # made the same build fail with "Failed to collect page data". Today CI's
      # Redis happens to be cold at this point, so the guard works by step ORDER
      # alone; blanking the URL means no future reordering can mask it.
      - name: Build (with NO database reachable — AC7 guard)
        env:
          DATABASE_URL: postgresql://glh:glh@127.0.0.1:1/greenlighthouse?schema=public
          REDIS_URL: ""
          # Blanked too (Story 3.0). Adding a third backing-service URL without
          # adding it here would silently narrow this guard: a reachable queue is
          # one more thing a build could come to depend on without anyone noticing.
          REDIS_QUEUE_URL: ""
        run: npm run build
      - run: npm run test

      # End-to-end. Until Story 1.8 these never ran in CI at all, which meant the
      # entire homepage could be deleted with the merge gate green (deferred from
      # the Story 1.7 review). Chromium only — it is the sole configured project.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Separate suite: the caching proof needs a PRODUCTION server, because
      # `next dev` does not engage the incremental cache handler at all.
      - run: npm run test:e2e:caching

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

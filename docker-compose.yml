# GREENLIGHTHOUSE — dev/prod-parity stack.
# Services: app, worker, postgres, redis, redis-queue, s3 (SeaweedFS), clamav.
# SETUP: run `cp .env.example .env` BEFORE `docker compose up` — the app/worker
#        services use `env_file: .env`, which must exist or compose errors.
# Healthchecks + `depends_on: condition: service_healthy` (Story 1.2) ensure the
# app/worker only start once their backing services accept connections.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Story 5.8 (review F1): both analytics values are BUILD-TIME. The domain is
      # inlined into the client bundle (NEXT_PUBLIC_) and `rewrites()` is baked into
      # routes-manifest.json, so `env_file` at runtime cannot switch analytics on.
      # Compose interpolates these from the project `.env`; empty = analytics off.
      # Changing either REQUIRES `docker compose build app`.
      args:
        NEXT_PUBLIC_ANALYTICS_DOMAIN: ${NEXT_PUBLIC_ANALYTICS_DOMAIN:-}
        PLAUSIBLE_HOST: ${PLAUSIBLE_HOST:-}
    ports:
      - "3000:3000"
    env_file: .env
    # `.env` carries HOST addresses (localhost:...), which are unreachable from
    # inside a container. Override the service addresses here (Story 3.0).
    # CLAMAV_HOST is corrected by Story 3.7b, which made `app` a clamd CLIENT —
    # the RFQ handler scans attachments in-process, so a `localhost` here would
    # refuse every connection and reject every attachment as `scanFailed`.
    # DATABASE_URL and S3_ENDPOINT still carry the same pre-existing defect and
    # stay logged in deferred-work.md; Story 3.3 needs DATABASE_URL for the worker.
    environment:
      REDIS_URL: redis://redis:6379
      REDIS_QUEUE_URL: redis://redis-queue:6379
      CLAMAV_HOST: clamav
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # `app` becomes a queue PRODUCER in Story 3.2.
      redis-queue:
        condition: service_healthy
      s3:
        condition: service_healthy
      # Story 3.7b: `app` scans RFQ attachments IN THE REQUEST HANDLER, so it is
      # a clamd client in its own right — not only the worker.
      clamav:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    # A crashed or wedged worker stops sending every inquiry email silently,
    # so it comes back on its own (Story 3.3).
    restart: unless-stopped
    # See the note on `app` — host addresses from `.env` are unreachable
    # in-container. DATABASE_URL is corrected HERE by Story 3.3, which made
    # the worker a Postgres client for the first time: it re-reads each lead
    # by id before sending. The `localhost` in `.env` was a documented
    # pre-existing defect assigned to this story.
    environment:
      DATABASE_URL: postgresql://glh:glh@postgres:5432/greenlighthouse?schema=public
      REDIS_URL: redis://redis:6379
      REDIS_QUEUE_URL: redis://redis-queue:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    # ⚠️ NO `clamav` DEPENDENCY (removed by Story 3.3). The worker never
    # contacts clamd: the attachment scan runs synchronously inside the RFQ
    # request handler (Story 3.7b). Gating worker startup behind clamav's
    # health — with its 360s start_period — delayed every inquiry email for
    # a service the worker does not use.

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: glh
      POSTGRES_PASSWORD: glh
      POSTGRES_DB: greenlighthouse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glh -d greenlighthouse"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    # The Next incremental cache. DISPOSABLE — the pre-proof step empties it.
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  redis-queue:
    # BullMQ (Story 3.3). A separate INSTANCE, not a separate DB index on the one
    # above: FLUSHALL is instance-wide, and maxmemory/eviction/persistence are too
    # — a shared instance tuned for cache eviction would drop queued jobs, which is
    # precisely what FR29 forbids. AOF on, because a lost job is a lost inquiry.
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - queuedata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  s3:
    # Local S3-compatible object storage: SeaweedFS's all-in-one `mini` mode.
    # REPLACED MinIO (2026-10): MinIO deleted its images from Docker Hub on
    # 2026-09-11 and Quay stopped anonymous pulls on 2026-09-24, so `minio/minio`
    # no longer pulls anywhere. Production uses Hetzner Object Storage instead
    # (docs/deploy.md); this is the dev/CI stand-in.
    #
    # Published on host :9000 — the port `.env` has always pointed at — so no
    # local `.env` changes. The keys stay the old dev values for the same reason;
    # SeaweedFS takes its admin identity from AWS_ACCESS_KEY_ID/SECRET, and
    # anonymous requests are refused (403).
    image: chrislusf/seaweedfs:4.48
    command: mini -dir=/data -master.telemetry=false
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "9000:8333"
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  clamav:
    # Pinned off :latest for reproducibility. The explicit healthcheck mirrors the
    # image's built-in clamd readiness probe.
    #
    # ⚠️ CORRECTED IN STORY 3.7b — the previous comment here claimed the 360s
    # start_period was needed because "freshclam downloads virus DBs on first
    # boot (minutes)". That is FALSE for this image: the signature databases are
    # BAKED IN (verified on the running container — `main.cvd` and
    # `bytecode.cvd` carry the image's build date, and only `daily.cld` is
    # fetched afterwards), so clamd can start scanning immediately. The 360s
    # stays as free slack on a slow machine, not as a documented requirement.
    # Do NOT "optimize" this to the `_base` tag: that is the variant that ships
    # WITHOUT signatures and genuinely does pay the multi-minute download.
    #
    # `app` depends on this via condition: service_healthy (Story 3.7b,
    # in-handler scanning). The WORKER does not — see its comment above.
    #
    # `clamav-debian` (2026-10): the Alpine `clamav/clamav` image is amd64-only
    # and production runs on arm64 (Oracle Ampere A1). This multi-arch digest is
    # pinned identically in docker-compose.prod.yml and CI; its signatures are
    # baked in too (main.cvd / daily.cvd / bytecode.cvd, verified 2026-10-07).
    image: clamav/clamav-debian@sha256:9bb8712a50f0e75166e936c452cd82dd5e5be0b85586598930b5bbb84a99a578
    ports:
      - "3310:3310"
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 360s

volumes:
  pgdata:
  s3data:
  queuedata:

# GREENLIGHTHOUSE — dev/prod-parity stack.
# Services: app, worker, postgres, redis, minio (S3-compatible), clamav.
# SETUP: run `cp .env.example .env` BEFORE `docker compose up` — the app/worker
#        services use `env_file: .env`, which must exist or compose errors.
# Healthchecks + `depends_on: condition: service_healthy` (Story 1.2) ensure the
# app/worker only start once their backing services accept connections.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file: .env
    # `.env` carries HOST addresses (localhost:...), which are unreachable from
    # inside a container. Override the service addresses here (Story 3.0). Only
    # the Redis pair is corrected in this story — DATABASE_URL, S3_ENDPOINT and
    # CLAMAV_HOST have the same pre-existing defect and are logged in
    # deferred-work.md; Story 3.3 needs DATABASE_URL fixed for the worker.
    environment:
      REDIS_URL: redis://redis:6379
      REDIS_QUEUE_URL: redis://redis-queue:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # `app` becomes a queue PRODUCER in Story 3.2.
      redis-queue:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    # See the note on `app` — host addresses from `.env` are unreachable in-container.
    environment:
      REDIS_URL: redis://redis:6379
      REDIS_QUEUE_URL: redis://redis-queue:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      clamav:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: glh
      POSTGRES_PASSWORD: glh
      POSTGRES_DB: greenlighthouse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glh -d greenlighthouse"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    # The Next incremental cache. DISPOSABLE — the pre-proof step empties it.
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  redis-queue:
    # BullMQ (Story 3.3). A separate INSTANCE, not a separate DB index on the one
    # above: FLUSHALL is instance-wide, and maxmemory/eviction/persistence are too
    # — a shared instance tuned for cache eviction would drop queued jobs, which is
    # precisely what FR29 forbids. AOF on, because a lost job is a lost inquiry.
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - queuedata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  minio:
    # Pinned off :latest — the curl-based healthcheck below depends on curl being
    # present in the image, which isn't guaranteed across future minimal images.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  clamav:
    # Pinned off :latest for reproducibility. The explicit healthcheck mirrors the
    # image's built-in clamd readiness probe with a generous start_period — freshclam
    # downloads virus DBs on first boot (minutes), during which clamd reports
    # "starting"; worker depends_on this via condition: service_healthy.
    image: clamav/clamav@sha256:24cab211a882e9f767b84b76afe197d82554306ad6d43b782f80cd6aa1e61427
    ports:
      - "3310:3310"
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 360s

volumes:
  pgdata:
  miniodata:
  queuedata:

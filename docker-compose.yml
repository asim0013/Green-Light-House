# GREENLIGHTHOUSE — dev/prod-parity stack.
# Services: app, worker, postgres, redis, minio (S3-compatible), clamav.
# SETUP: run `cp .env.example .env` BEFORE `docker compose up` — the app/worker
#        services use `env_file: .env`, which must exist or compose errors.
# Healthchecks + `depends_on: condition: service_healthy` (Story 1.2) ensure the
# app/worker only start once their backing services accept connections.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: glh
      POSTGRES_PASSWORD: glh
      POSTGRES_DB: greenlighthouse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glh -d greenlighthouse"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  clamav:
    # The clamav/clamav image ships its own HEALTHCHECK (clamd readiness); it
    # reports "starting" until virus DBs load (can take a few minutes), then "healthy".
    image: clamav/clamav:latest
    ports:
      - "3310:3310"

volumes:
  pgdata:
  miniodata:
